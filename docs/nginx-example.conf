# LinkEasy Publisher — sample web server configuration
#
# Nginx + PHP-FPM. The document root MUST be public/ so that config/, app/,
# storage/ and routes/ are never reachable over HTTP.

server {
    listen 443 ssl http2;
    server_name publisher.example.com;

    ssl_certificate     /etc/letsencrypt/live/publisher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publisher.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/linkeasy/php-app/public;
    index index.php;

    client_max_body_size 4096M;   # large video uploads; also raise php.ini limits
    client_body_timeout  600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Long-running media streaming and large uploads.
        fastcgi_read_timeout 600s;
        fastcgi_request_buffering off;
    }

    # Never expose dotfiles or storage artifacts.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sqlite|log|sql|ini|env)$ { deny all; }
}
