name: Build Windows installer

# Produces a downloadable LinkEasy Publisher .exe without needing a Windows
# development machine: GitHub compiles it and attaches the artefacts to the run.
#
#   Actions -> Build Windows installer -> Run workflow
#   then download "LinkEasyPublisher-windows" from the run summary.
#
# Optional repository secrets for signed builds:
#   WIN_CSC_LINK          base64 of the .pfx, or a URL to it
#   WIN_CSC_KEY_PASSWORD  the .pfx password
# Without them the build still succeeds, but the .exe is unsigned.
#
# Two jobs:
#   test  — the offline PHP/Node suites, on Linux. These exercise the PHP
#           control plane, which is what actually runs in production
#           (php-app on a Linux web server per the README). Running them on
#           Linux also matches the POSIX file-permission assertions the media
#           security tests make; those assertions are meaningless on
#           Windows/NTFS and would fail there regardless of code correctness.
#   build — assembles the bundled runtime and builds the Windows installer.
#           Only this half needs windows-latest, and it only starts once the
#           tests above have passed.

on:
  workflow_dispatch:
    inputs:
      portable_only:
        description: 'Build only the portable .exe (faster)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Use PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, fileinfo, zip
          coverage: none

      - name: Server test suite (PHP)
        run: |
          php --version
          php tests/php/run.php

      - name: Worker test suite (Node)
        working-directory: windows-app
        # A bare directory path makes `node --test` try to require() it as a
        # module rather than discover files inside it, and fails with
        # MODULE_NOT_FOUND. A glob against the actual test files is what
        # triggers Node's real test discovery.
        run: node --test tests/unit/*.test.js

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content windows-app/package.json -Raw | ConvertFrom-Json
          "value=$($pkg.version)" >> $env:GITHUB_OUTPUT

      # ---- bundled runtime: Node, Playwright, Chromium, FFmpeg ----

      - name: Assemble the bundled runtime
        working-directory: installer
        run: |
          node build-runtime.js --payload
          node verify-runtime.js

      # ---- the application itself ----

      - name: Install application dependencies
        working-directory: windows-app
        run: npm install --no-fund --no-audit

      - name: Build the installer and the portable exe
        working-directory: windows-app
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:WIN_CSC_LINK) {
            Write-Host "Signing with the configured certificate."
          } else {
            Write-Warning "No signing certificate configured — the build will be unsigned."
          }
          if ('${{ inputs.portable_only }}' -eq 'true') {
            npm run dist:portable
          } else {
            npm run dist
          }

      - name: Report what was produced
        working-directory: windows-app
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              $sig = Get-AuthenticodeSignature $_.FullName
              "{0,-45} {1,8:N1} MB  signed={2}" -f $_.Name, ($_.Length / 1MB), ($sig.Status -eq 'Valid')
            } | Write-Host

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: LinkEasyPublisher-windows
          path: |
            windows-app/dist/*.exe
            windows-app/dist/*.zip
            windows-app/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-app/dist/*.exe
            windows-app/dist/latest.yml
          body: |
            LinkEasy Publisher ${{ steps.version.outputs.value }}

            Download **LinkEasyFacebookPublisherSetup.exe** and run it. Everything the
            application needs (Node, Playwright, Chromium, FFmpeg) is bundled — nothing
            else has to be installed, and no command line is involved.

            The app connects to your own LinkEasy workspace; sign in with the browser
            window it opens. Facebook passwords are never requested or stored.
